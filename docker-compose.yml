version: "3.8"

x-airflow-common: &airflow-common
    image: apache/airflow:2.9.3
    environment:
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
        ES_HOST: http://elasticsearch:9200
        ES_USER: elastic
        ES_PASSWORD: ${ELASTIC_PASSWORD:-changeme123}
        _PIP_ADDITIONAL_REQUIREMENTS: requests>=2.31.0
    volumes:
        - ./dags:/opt/airflow/dags
        - ./scripts:/opt/airflow/scripts
        - ./data:/opt/airflow/data
        - ./elasticsearch:/opt/airflow/elasticsearch
        - airflow-logs:/opt/airflow/logs
    depends_on:
        postgres:
            condition: service_healthy
        elasticsearch:
            condition: service_healthy
    networks:
        - etl_network

services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: airflow
            POSTGRES_PASSWORD: airflow
            POSTGRES_DB: airflow
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "airflow"]
            interval: 5s
            retries: 10
        networks:
            - etl_network

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        environment:
            - node.name=es01
            - discovery.type=single-node
            - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme123}
            - xpack.security.enabled=true
            - xpack.security.http.ssl.enabled=false
            - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
        volumes:
            - es-data:/usr/share/elasticsearch/data
        ports:
            - "9200:9200"
        healthcheck:
            test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD:-changeme123} http://localhost:9200/_cluster/health | grep -q '\"status\"' || exit 1"]
            interval: 15s
            timeout: 10s
            retries: 10
        networks:
            - etl_network

    kibana:
        image: docker.elastic.co/kibana/kibana:8.15.0
        depends_on:
            elasticsearch:
                condition: service_healthy
        environment:
            - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
            - ELASTICSEARCH_USERNAME=kibana_system
            - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:-changeme123}
        ports:
            - "5601:5601"
        networks:
            - etl_network

    airflow-init:
        <<: *airflow-common
        entrypoint: /bin/bash
        command:
            - -c
            - airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com

    airflow-webserver:
        <<: *airflow-common
        command: webserver
        ports:
            - "8080:8080"
        depends_on:
            airflow-init:
                condition: service_completed_successfully

    airflow-scheduler:
        <<: *airflow-common
        command: scheduler
        depends_on:
            airflow-init:
                condition: service_completed_successfully

volumes:
    postgres-data:
    es-data:
    airflow-logs:

networks:
    etl_network:
        driver: bridge
